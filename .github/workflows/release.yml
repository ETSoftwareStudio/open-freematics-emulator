name: Release

# Push a tag that matches apps/desktop/package.json's version (v0.2.0, or v0.2.0-beta.1 for a
# prerelease) to build every installer, publish a GitHub Release, publish the npm package and
# update the Homebrew tap. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Match the tag to the app version
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run check

  desktop:
    needs: verify
    uses: ./.github/workflows/desktop.yml
    with:
      sign: true
    # Only the macOS signing secrets are read; without them the app is ad-hoc signed.
    secrets: inherit

  npm-package:
    name: npm package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run npm:stage
      - run: pnpm exec vp run npm:smoke
      - run: mkdir npm-dist && npm pack ./apps/server/.stage/npm --pack-destination npm-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: npm-dist/*.tgz
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [verify, desktop, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Open Freematics Emulator $VERSION" "${flags[@]}"

  npm:
    name: Publish to npm
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the registry trusts this workflow instead of a stored token.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - name: Publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tag=latest
          if [ "$PRERELEASE" = "true" ]; then tag=next; fi
          npm publish "open-freematics-emulator-$VERSION.tgz" --access public --tag "$tag"

  homebrew:
    name: Update the Homebrew tap
    needs: [verify, github-release]
    if: vars.HOMEBREW_TAP != '' && needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/homebrew
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macOS
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write and push the cask
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          arm64=$(sha256sum "dist/open-freematics-emulator-$VERSION-mac-arm64.dmg" | cut -d' ' -f1)
          x64=$(sha256sum "dist/open-freematics-emulator-$VERSION-mac-x64.dmg" | cut -d' ' -f1)
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256_ARM64@/$arm64/" -e "s/@SHA256_X64@/$x64/" \
            -e '1,2d' packaging/homebrew/open-freematics-emulator.rb > tap/Casks/open-freematics-emulator.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/open-freematics-emulator.rb
          git commit -m "open-freematics-emulator $VERSION"
          git push
