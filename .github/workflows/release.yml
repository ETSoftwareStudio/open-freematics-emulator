name: Release

# release-please keeps a release PR open on main; merging it creates a draft GitHub Release and
# its tag, and the jobs below build, publish and un-draft it. Publishing lives here because a tag
# created with GITHUB_TOKEN starts no other workflow. See RELEASING.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      # The release PR gets no pull_request runs (GITHUB_TOKEN), so start CI on it.
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref release-please--branches--main

  check:
    name: Check
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the serial port library the Rust server links
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run check

  desktop:
    needs: check
    uses: ./.github/workflows/desktop.yml
    with:
      sign: true
    # Only the macOS signing secrets are read; without them the app is ad-hoc signed.
    secrets: inherit

  # One platform package per target, each with the `fme` binary built on its own runner (macOS
  # x64 cross-compiles), and the main package (launcher + web app) from the Linux x64 runner. No
  # Rust cache here, so a release builds from the lockfile alone.
  npm-package:
    name: npm package (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64, smoke: true }
          - { runner: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64, smoke: false }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64, smoke: true }
          - {
              runner: windows-11-arm,
              target: aarch64-pc-windows-msvc,
              npm: win32-arm64,
              smoke: true,
            }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, npm: linux-x64, smoke: true }
          - {
              runner: ubuntu-22.04-arm,
              target: aarch64-unknown-linux-gnu,
              npm: linux-arm64,
              smoke: true,
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the serial port library the Rust server links
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: rustup target add ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run npm:stage --target ${{ matrix.target }}
      - name: Smoke-test the packages as npx runs them
        if: matrix.smoke
        run: pnpm exec vp run npm:smoke
      - name: Pack
        shell: bash
        run: |
          mkdir npm-dist
          npm pack "./.stage/npm/open-freematics-emulator-${{ matrix.npm }}" --pack-destination npm-dist
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then
            npm pack ./.stage/npm/open-freematics-emulator --pack-destination npm-dist
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.npm }}
          path: npm-dist/*.tgz
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [release-please, desktop, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Upload the installers and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --title "Open Freematics Emulator $VERSION"

  npm:
    name: Publish to npm
    needs: [release-please, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the registry trusts this workflow instead of a stored token.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-*
          path: npm-dist
          merge-multiple: true
      # The platform packages go first: the main package's optionalDependencies point at them.
      # A version that's already on npm is skipped, so a re-run finishes a half-done publish.
      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          publish() {
            if curl -fs -o /dev/null "https://registry.npmjs.org/$1/$VERSION"; then
              echo "$1@$VERSION is already on npm"
            else
              npm publish "npm-dist/$1-$VERSION.tgz" --access public
            fi
          }
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            publish "open-freematics-emulator-$platform"
          done
          publish open-freematics-emulator

  homebrew:
    name: Update the Homebrew tap
    needs: [release-please, github-release]
    if: vars.HOMEBREW_TAP != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/homebrew
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macOS
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write and push the cask
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          arm64=$(sha256sum "dist/open-freematics-emulator-$VERSION-mac-arm64.dmg" | cut -d' ' -f1)
          x64=$(sha256sum "dist/open-freematics-emulator-$VERSION-mac-x64.dmg" | cut -d' ' -f1)
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256_ARM64@/$arm64/" -e "s/@SHA256_X64@/$x64/" \
            -e '1,2d' packaging/homebrew/open-freematics-emulator.rb > tap/Casks/open-freematics-emulator.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/open-freematics-emulator.rb
          git commit -m "open-freematics-emulator $VERSION"
          git push
