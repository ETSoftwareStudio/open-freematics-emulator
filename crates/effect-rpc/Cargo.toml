[package]
name = "effect-rpc"
description = "An Effect RPC server for Rust, wire-compatible with Effect v4's WebSocket protocol and JSON serialization."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"
repository = "https://github.com/ETSoftwareStudio/open-freematics-emulator"
keywords = ["effect", "rpc", "websocket", "axum", "typescript"]
categories = ["network-programming", "web-programming::websocket"]

[features]
default = ["server"]
# The handler registry and the per-connection state machine, on tokio.
server = ["dep:futures-util", "dep:tokio", "dep:tracing"]
# Serving a connection over an axum WebSocket.
axum = ["server", "dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
indexmap.workspace = true
ryu-js.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-tungstenite.workspace = true

[[example]]
name = "counter"
required-features = ["axum"]

[[test]]
name = "websocket"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
