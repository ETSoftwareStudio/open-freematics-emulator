<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Open Freematics Emulator</title>
    <script>
      // Applies the appearance before first paint; src/lib/appearance.ts keeps it current.
      (function () {
        var mode = "system";
        try {
          if (!window.fme) mode = localStorage.getItem("fme:appearance") || "system";
        } catch (error) {}
        var dark =
          mode === "dark" ||
          (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
