[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
aes = "0.8"
fme-core = { path = "crates/fme-core" }
indexmap = { version = "2", features = ["serde"] }
nix = { version = "0.30", features = ["fs", "term"] }
serialport = "4"
serde = { version = "1", features = ["derive"] }
# JavaScript objects keep insertion order, and so must JSON values crossing the wire.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# The Rust side of the rules in docs/internals/rust-services.md.
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
await_holding_lock = "deny"
let_underscore_must_use = "deny"
